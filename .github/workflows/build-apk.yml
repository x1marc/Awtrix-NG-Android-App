name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter-Version
        run: flutter --version

      # Android-Projektgeruest erzeugen (android/ etc.) - Code liegt schon in lib/.
      - name: Android-Geruest erzeugen
        run: flutter create --platforms=android --project-name awtrix_ng_remote --org com.x1marc .

      # flutter create ueberschreibt pubspec.yaml + lib/main.dart -> eigene Dateien zuruecksetzen.
      - name: Eigene lib/pubspec wiederherstellen
        run: git checkout -- pubspec.yaml lib

      - name: Manifest anpassen (INTERNET + https-queries fuer url_launcher)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          grep -q '<queries>' "$M" || \
            sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' "$M"
          echo "----- AndroidManifest.xml -----"
          cat "$M"

      - name: MainActivity ersetzen (MIUI-Autofill-Grau aus)
        run: |
          FOUND=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          if [ -n "$FOUND" ]; then
            cp android_overrides/MainActivity.kt "$FOUND"
            echo "ersetzt: $FOUND"
          else
            DEST=android/app/src/main/kotlin/com/x1marc/awtrix_ng_remote/MainActivity.kt
            mkdir -p "$(dirname "$DEST")"
            cp android_overrides/MainActivity.kt "$DEST"
            echo "neu: $DEST"
          fi

      - name: Abhaengigkeiten holen
        run: flutter pub get

      - name: App-Icon erzeugen (Launcher-Icons)
        run: dart run flutter_launcher_icons

      - name: APK bauen (release)
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --build-name=3.1.${{ github.run_number }}

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: awtrix-ng-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: APK als Release "latest" veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste APK
          body: Automatisch gebaute APK. Auf dem Handy installieren (Quelle "Unbekannt" erlauben).
          files: build/app/outputs/flutter-apk/app-release.apk
