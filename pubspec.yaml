name: awtrix_ng_remote
description: Lokale Fernbedienung für AWTRIX NG (Discovery + volle HTTP-API).
publish_to: 'none'
version: 3.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A18"
  adaptive_icon_foreground: "assets/icon.png"
